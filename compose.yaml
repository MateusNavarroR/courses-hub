services:
  courses-hub:
    build: .
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${COURSES_HUB_PORT:-8766}:8000"
    volumes:
      - "./.data:/data"
      - "${COURSES_DIR:-./courses}:${COURSES_MOUNT:-/courses}:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
